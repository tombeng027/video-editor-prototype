[project]
name = "vision"
version = "0.1.0"
license = "Apache-2.0"
description = "Local vision service for the video editor prototype (CLIP scoring planned for M6)"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "httpx2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv]
package = false
