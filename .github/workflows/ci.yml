name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  launcher:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: choco install ffmpeg -y --no-progress
      - run: pnpm install --frozen-lockfile
      - name: Windows launcher regression checks
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts\test-launcher.ps1
      - name: Log retention safety checks
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts\test-log-retention.ps1
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: launcher-logs
          path: ~/AppData/Local/VideoEditorPrototype/launcher/
  js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
  vision:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/vision
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv run pytest
